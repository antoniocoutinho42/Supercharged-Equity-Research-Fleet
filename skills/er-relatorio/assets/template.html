<!doctype html>
<html lang="$idioma">
<head>
<meta charset="utf-8">
<title>$titulo</title>
<style>
  :root {
    color-scheme: light;
    --cor-fundo: #f7f7f5;
    --cor-papel: #ffffff;
    --cor-texto: #1f2328;
    --cor-texto-suave: #57606a;
    --cor-borda: #d8dbe0;
    --cor-acento: #1b3a5c;
    --cor-acento-suave: #eef2f6;
    --cor-disclosure-fundo: #fff8ea;
    --cor-disclosure-borda: #c98a10;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 0;
    background: var(--cor-fundo);
    color: var(--cor-texto);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .pagina {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 24px 64px;
  }
  header.cabecalho-relatorio h1 {
    font-size: 1.6rem;
    margin: 0 0 4px;
    color: var(--cor-acento);
  }
  nav.abas-nav {
    display: flex;
    gap: 4px;
    margin: 24px 0 0;
    border-bottom: 2px solid var(--cor-borda);
  }
  .aba-botao {
    appearance: none;
    border: none;
    background: transparent;
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--cor-texto-suave);
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 3px solid transparent;
    margin-bottom: -2px;
  }
  .aba-botao[aria-selected="true"] {
    color: var(--cor-acento);
    border-bottom-color: var(--cor-acento);
  }
  .aba-botao:hover {
    color: var(--cor-acento);
  }
  .aba-painel {
    background: var(--cor-papel);
    border: 1px solid var(--cor-borda);
    border-top: none;
    padding: 24px;
  }
  .aba-painel[hidden] {
    display: none;
  }
  .aba-painel h1 {
    font-size: 1.4rem;
    margin-top: 0;
    color: var(--cor-acento);
  }
  .aba-painel h2 {
    font-size: 1.05rem;
    color: var(--cor-acento);
    border-bottom: 1px solid var(--cor-borda);
    padding-bottom: 6px;
    margin: 28px 0 12px;
  }
  .aba-painel section:first-of-type h2 {
    margin-top: 0;
  }
  .conclusao p {
    font-size: 1.05rem;
  }
  .disclosures {
    background: var(--cor-disclosure-fundo);
    border: 1px solid var(--cor-disclosure-borda);
    border-radius: 6px;
    padding: 14px 18px 18px;
  }
  .disclosures h2 {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--cor-disclosure-borda);
    border-bottom: none;
    margin: 0 0 10px;
    padding-bottom: 0;
  }
  .disclosures ul {
    padding-left: 20px;
    margin: 0;
  }
  .disclosures-vazio {
    background: var(--cor-acento-suave);
    border-color: var(--cor-borda);
  }
  .disclosures-vazio h2 {
    color: var(--cor-texto-suave);
  }
  .disclosures-vazio p {
    margin: 0;
  }
  .valuation-cabecalho {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  .metrica {
    display: flex;
    flex-direction: column;
    min-width: 140px;
  }
  .metrica-rotulo {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--cor-texto-suave);
  }
  .metrica-valor {
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--cor-acento);
  }
  .valuation-multiplos .metrica-valor,
  .valuation-rota .metrica-valor {
    font-size: 1.15rem;
  }
  .metrica-nota {
    font-size: 0.82rem;
    color: var(--cor-texto-suave);
  }
  .valuation-multiplos,
  .valuation-rota {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
  }
  .sotp-nota {
    color: var(--cor-texto-suave);
    font-style: italic;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 0.9rem;
  }
  th, td {
    border: 1px solid var(--cor-borda);
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
  }
  thead th {
    background: var(--cor-acento-suave);
  }
  .ficha-tecnica th {
    background: var(--cor-acento-suave);
    width: 220px;
  }
  footer.rodape-relatorio {
    margin-top: 24px;
    font-size: 0.78rem;
    color: var(--cor-texto-suave);
  }
  .exhibits-vazio p {
    color: var(--cor-texto-suave);
  }
  .exhibit {
    border: 1px solid var(--cor-borda);
    border-radius: 6px;
    padding: 14px 18px 18px;
    margin: 0 0 18px;
  }
  .exhibit h3 {
    font-size: 1rem;
    margin: 0 0 8px;
    color: var(--cor-texto);
  }
  .exhibit-nota-janela {
    font-size: 0.82rem;
    font-style: italic;
    color: var(--cor-texto-suave);
    margin: 0 0 10px;
  }
  .exhibit-caption {
    font-size: 0.85rem;
    color: var(--cor-texto-suave);
    margin: 10px 0 0;
  }
  .exhibit-grafico {
    min-height: 60px;
  }
  .exhibit-indisponivel {
    color: var(--cor-texto-suave);
    font-style: italic;
  }
  .painel-grafico {
    overflow-x: auto;
  }
  .painel-grafico svg {
    display: block;
    max-width: 100%;
    height: auto;
  }
  .laboratorio .lab-nota,
  .laboratorio .lab-campo .lab-nota {
    font-size: 0.85rem;
    color: var(--cor-texto-suave);
  }
  .lab-badge {
    font-size: 0.85rem;
    padding: 10px 14px;
    margin: 0 0 18px;
    background: var(--cor-acento-suave);
    border: 1px solid var(--cor-borda);
  }
  .lab-badge[data-estado="divergente"],
  .lab-badge[data-estado="indisponivel"] {
    background: var(--cor-disclosure-fundo);
    border-color: var(--cor-disclosure-borda);
  }
  .lab-badge ul {
    margin: 6px 0 0;
    padding-left: 20px;
  }
  .lab-cenario {
    border: 1px solid var(--cor-borda);
    padding: 14px 18px 18px;
    margin: 0 0 18px;
  }
  .lab-cenario h3 {
    font-size: 1rem;
    margin: 0 0 10px;
  }
  .lab-saidas {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin: 0 0 14px;
  }
  .lab-saidas .metrica-valor {
    font-size: 1.15rem;
  }
  .lab-diagnosticos {
    margin: 0 0 14px;
  }
  .lab-diagnosticos ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  .lab-diagnostico {
    font-size: 0.85rem;
    padding: 4px 10px;
    margin: 0 0 4px;
    border: 1px solid var(--cor-borda);
    border-radius: 4px;
  }
  .lab-diagnostico-alerta {
    background: var(--cor-disclosure-fundo);
    border-color: var(--cor-disclosure-borda);
  }
  .lab-diagnostico-atencao {
    background: var(--cor-acento-suave);
    border-color: var(--cor-acento);
  }
  .lab-diagnostico-vazio,
  .lab-diagnostico-desconhecido,
  .lab-diagnostico-recusado {
    color: var(--cor-texto-suave);
  }
  .lab-diagnostico-recusado {
    border-style: dashed;
  }
  .lab-diagnostico-vazio {
    border-color: transparent;
    padding-left: 0;
  }
  .lab-blocos {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
  }
  .lab-bloco {
    flex: 1 1 240px;
    min-width: 220px;
  }
  .lab-bloco h4,
  .lab-diagnosticos h4 {
    font-size: 0.74rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--cor-texto-suave);
    margin: 0 0 8px;
  }
  .lab-campo {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: baseline;
    gap: 2px 10px;
    margin: 0 0 10px;
  }
  .lab-campo label {
    font-size: 0.88rem;
  }
  .lab-campo input,
  .lab-campo select {
    font: inherit;
    font-size: 0.88rem;
    padding: 3px 6px;
    border: 1px solid var(--cor-borda);
    background: var(--cor-papel);
    color: var(--cor-texto);
    max-width: 170px;
  }
  .lab-campo input[type="checkbox"] {
    justify-self: end;
    max-width: none;
  }
  .lab-campo input:disabled {
    color: var(--cor-texto-suave);
    background: var(--cor-fundo);
  }
  .lab-campo input[aria-invalid="true"] {
    border-color: var(--cor-disclosure-borda);
  }
  .lab-campo .lab-original,
  .lab-campo .lab-nota {
    grid-column: 1 / -1;
    font-size: 0.78rem;
    color: var(--cor-texto-suave);
  }
  .lab-acoes {
    margin: 14px 0 0;
  }
  .lab-acoes button {
    font: inherit;
    font-size: 0.85rem;
    padding: 5px 12px;
    border: 1px solid var(--cor-borda);
    background: var(--cor-papel);
    color: var(--cor-acento);
    cursor: pointer;
  }
  .lab-acoes button:disabled {
    color: var(--cor-texto-suave);
    cursor: default;
  }
  .lab-congelado h4,
  .lab-congelado-nota {
    font-size: 0.82rem;
    color: var(--cor-texto-suave);
  }
  .lab-congelado h4 {
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin: 0 0 6px;
  }
  .lab-congelado ul {
    margin: 0;
    padding-left: 20px;
    font-size: 0.82rem;
    color: var(--cor-texto-suave);
  }
</style>
<style>$css_uplot</style>
</head>
<body>
<div class="pagina">
  <header class="cabecalho-relatorio">
    <h1>$titulo</h1>
  </header>
  <nav class="abas-nav" role="tablist">
    <button type="button" class="aba-botao" role="tab" data-aba="tese" aria-selected="true">$rotulo_aba_tese</button>
    <button type="button" class="aba-botao" role="tab" data-aba="valuation" aria-selected="false">$rotulo_aba_valuation</button>
    <button type="button" class="aba-botao" role="tab" data-aba="evidencia" aria-selected="false">$rotulo_aba_evidencia</button>
  </nav>
  <section id="aba-tese" class="aba-painel" role="tabpanel" data-aba-painel="tese">
    $corpo_tese
  </section>
  <section id="aba-valuation" class="aba-painel" role="tabpanel" data-aba-painel="valuation" hidden>
    $corpo_valuation
  </section>
  <section id="aba-evidencia" class="aba-painel" role="tabpanel" data-aba-painel="evidencia" hidden>
    $corpo_evidencia
  </section>
</div>
<script>
(function () {
  "use strict";
  var botoes = document.querySelectorAll(".aba-botao");
  var paineis = document.querySelectorAll(".aba-painel");
  function selecionar(nomeAba) {
    for (var i = 0; i < botoes.length; i++) {
      var ativo = botoes[i].getAttribute("data-aba") === nomeAba;
      botoes[i].setAttribute("aria-selected", ativo ? "true" : "false");
    }
    for (var j = 0; j < paineis.length; j++) {
      paineis[j].hidden = paineis[j].getAttribute("data-aba-painel") !== nomeAba;
    }
  }
  for (var k = 0; k < botoes.length; k++) {
    botoes[k].addEventListener("click", function (evento) {
      selecionar(evento.currentTarget.getAttribute("data-aba"));
    });
  }
})();
</script>
<script type="application/json" id="fleet-dados-exhibits">$dados_exhibits</script>
<script>$js_uplot</script>
<script>$js_graficos</script>
<script>$js_svg</script>
<script>
(function () {
  "use strict";
  var elementoDados = document.getElementById("fleet-dados-exhibits");
  if (!elementoDados) { return; }
  var dados = JSON.parse(elementoDados.textContent);

  // Exhibits (cartesianos/tabela) e paineis SVG sao embutidos de forma
  // INDEPENDENTE pelo render.py -- uma entrega pode ter um sem o outro --,
  // entao cada bloco checa o SEU modulo antes de usa-lo.
  if (typeof FleetGraficos !== "undefined") {
    var hosts = document.querySelectorAll(".exhibit-grafico");
    for (var i = 0; i < dados.exhibits.length && i < hosts.length; i++) {
      FleetGraficos.renderizar(hosts[i], dados.exhibits[i], dados.formatacao);
    }
  }

  if (typeof FleetSVG === "undefined") { return; }
  var paineis = dados.paineis_valuation || {};
  var hostPonte = document.querySelector('[data-painel="ponte"]');
  if (hostPonte && paineis.ponte) {
    hostPonte.innerHTML = FleetSVG.waterfall(paineis.ponte.parcelas, {
      total: paineis.ponte.total,
      formato: paineis.ponte.formato
    });
  }
  var hostsMatriz = document.querySelectorAll('[data-painel="matriz"]');
  var matrizes = paineis.matrizes || [];
  for (var m = 0; m < matrizes.length && m < hostsMatriz.length; m++) {
    hostsMatriz[m].innerHTML = FleetSVG.matriz(matrizes[m].grade, {
      base: matrizes[m].base,
      rotuloX: matrizes[m].rotuloX,
      rotuloY: matrizes[m].rotuloY,
      formato: matrizes[m].formato,
      formatoX: matrizes[m].formatoX,
      formatoY: matrizes[m].formatoY
    });
  }
})();
</script>
<script type="application/json" id="fleet-dados-laboratorio">$dados_laboratorio</script>
<script>$js_espelho</script>
<script>$js_fachada</script>
<script>$js_laboratorio</script>
<script>
(function () {
  "use strict";
  // Laboratorio da aba Valuation (fatia 5C): os tres <script> acima so entram
  // na pagina quando ha painel, e este bloco checa cada peca antes de usa-la
  // -- um relatorio sem laboratorio carrega o payload nulo e sai daqui.
  var elementoDados = document.getElementById("fleet-dados-laboratorio");
  if (!elementoDados) { return; }
  var dados = JSON.parse(elementoDados.textContent);
  if (!dados) { return; }
  var raiz = document.querySelector("[data-laboratorio]");
  if (!raiz || typeof FleetLaboratorio === "undefined") { return; }
  FleetLaboratorio.iniciar(raiz, dados);
})();
</script>
</body>
</html>
