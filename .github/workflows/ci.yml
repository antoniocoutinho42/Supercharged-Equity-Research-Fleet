name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: pip install pytest pyyaml

      - name: Suíte da metodologia (vendor multiplos-justos v9.24)
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python skills/er-multiplos-justos/vendor/multiplos-justos/scripts/justos.py selftest
          python skills/er-multiplos-justos/vendor/multiplos-justos/scripts/testes.py

      - name: pytest
        run: python -m pytest tests/ -q

      - name: Estrutura do plugin
        run: |
          python -c "import json; d=json.load(open('.claude-plugin/plugin.json', encoding='utf-8')); assert all(k in d and d[k] for k in ('name','version','description')), 'campos obrigatorios faltando'; print('plugin.json OK:', d['name'], d['version'])"
