name: CI

on:
  push:
  pull_request:

jobs:
  fleet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Estrutura e invariantes do plugin
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate-plugin.py
      - name: Suíte Múltiplos Justos v10.1
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python skills/multiplos-justos/scripts/testes.py --phase model
          python skills/multiplos-justos/scripts/testes.py --phase cli
