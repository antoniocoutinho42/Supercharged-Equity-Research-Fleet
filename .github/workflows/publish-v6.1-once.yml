name: Publish v6.1.0 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'antoniocoutinho42/Supercharged-Equity-Research-Fleet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b26987a305464444a76413d35e39adbb9a90fffa

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate-plugin.py

      - name: Run Múltiplos Justos suite
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python skills/multiplos-justos/scripts/testes.py --phase model
          python skills/multiplos-justos/scripts/testes.py --phase cli

      - name: Package v6.1.0
        run: |
          zip -r "equity-research-fleet-v6.1.0.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '.superpowers/*' \
            -x '**/__pycache__/*' \
            -x 'docs/fontes/*' \
            -x 'tests/*'

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v6.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v6.1.0 already exists"
            exit 0
          fi
          gh release create v6.1.0 \
            "equity-research-fleet-v6.1.0.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target b26987a305464444a76413d35e39adbb9a90fffa \
            --title "v6.1.0" \
            --notes-file "docs/releases/v6.1.0.md"
