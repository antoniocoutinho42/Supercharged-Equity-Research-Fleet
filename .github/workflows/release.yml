name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: pip install pytest pyyaml

      - name: pytest
        run: if [ -d tests ]; then python -m pytest tests -q; else echo "tests/ ainda não existe"; fi

      - name: Estrutura do plugin
        run: |
          python -c "import json; d=json.load(open('.claude-plugin/plugin.json', encoding='utf-8')); assert all(k in d and d[k] for k in ('name','version','description')), 'campos obrigatorios faltando'; print('plugin.json OK:', d['name'], d['version'])"

      - name: Validar tag == version do plugin.json
        run: python -c "import json,os; v=json.load(open('.claude-plugin/plugin.json'))['version']; t=os.environ['GITHUB_REF_NAME']; assert t=='v'+v, f'tag {t} != v{v}'"

      - name: Empacotar ZIP
        run: zip -r "equity-research-fleet-${GITHUB_REF_NAME}.zip" . -x '.git/*' -x '.github/*' -x '.superpowers/*' -x '**/__pycache__/*' -x 'docs/fontes/*' -x 'tests/*'

      - name: Corpo do release (opcional, docs/releases/<tag>.md)
        id: notas
        run: |
          if [ -f "docs/releases/${GITHUB_REF_NAME}.md" ]; then
            echo "path=docs/releases/${GITHUB_REF_NAME}.md" >> "$GITHUB_OUTPUT"
          fi

      # A acao de terceiros falhou com "Error creating asset temp dir" ao publicar a v4.0.0.
      # A CLI do GitHub ja vem no runner e nao depende de acao externa.
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP="equity-research-fleet-${GITHUB_REF_NAME}.zip"
          NOTAS="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTAS" ]; then
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --notes-file "$NOTAS"
          else
            gh release create "$GITHUB_REF_NAME" "$ZIP" --title "$GITHUB_REF_NAME" --generate-notes
          fi
