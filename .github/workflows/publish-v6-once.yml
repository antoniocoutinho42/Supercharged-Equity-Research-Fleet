name: Publish v6.0.0 once

on:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'antoniocoutinho42/Supercharged-Equity-Research-Fleet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f17ca6744b685ef8cb53d50fa6445a2257ff1545

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate plugin
        run: python scripts/validate-plugin.py

      - name: Run Múltiplos Justos suite
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python skills/multiplos-justos/scripts/testes.py --phase model
          python skills/multiplos-justos/scripts/testes.py --phase cli

      - name: Package clean v6
        run: |
          zip -r "equity-research-fleet-v6.0.0.zip" . \
            -x '.git/*' \
            -x '.github/*' \
            -x '**/__pycache__/*'

      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v6.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v6.0.0 already exists"
            exit 0
          fi
          gh release create v6.0.0 \
            "equity-research-fleet-v6.0.0.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target f17ca6744b685ef8cb53d50fa6445a2257ff1545 \
            --title "v6.0.0" \
            --generate-notes
